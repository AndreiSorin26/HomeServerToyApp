<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>HomeServer Toy App</title>
    <style>
      :root { color-scheme: light; font-family: Inter, ui-sans-serif, system-ui, sans-serif; color: #172033; background: #f3f6fb; }
      * { box-sizing: border-box; }
      body { margin: 0; }
      main { width: min(1100px, calc(100% - 2rem)); margin: 0 auto; padding: 2.5rem 0 4rem; }
      header { display: flex; align-items: end; justify-content: space-between; gap: 1rem; margin-bottom: 1.5rem; }
      h1, h2 { margin: 0; line-height: 1.15; }
      h1 { font-size: clamp(1.8rem, 5vw, 3rem); }
      h2 { font-size: 1.1rem; }
      p { color: #60708c; }
      .eyebrow { margin: 0 0 .35rem; color: #5965d8; font-size: .75rem; font-weight: 800; letter-spacing: .12em; text-transform: uppercase; }
      .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 300px), 1fr)); gap: 1rem; }
      .card { min-width: 0; padding: 1.25rem; border: 1px solid #e2e7f0; border-radius: 18px; background: #fff; box-shadow: 0 8px 26px rgba(28, 39, 70, .06); }
      .wide { grid-column: 1 / -1; }
      form { display: flex; flex-wrap: wrap; gap: .65rem; margin-top: 1rem; }
      input { min-width: 0; flex: 1 1 180px; padding: .7rem .8rem; border: 1px solid #cfd6e4; border-radius: 10px; font: inherit; }
      input:focus { outline: 3px solid #dfe3ff; border-color: #6570dc; }
      button { padding: .72rem 1rem; border: 0; border-radius: 10px; color: #fff; background: #5965d8; font: inherit; font-weight: 750; cursor: pointer; }
      button:hover { background: #4651c5; }
      button:disabled { opacity: .55; cursor: wait; }
      ul { margin: 1rem 0 0; padding: 0; list-style: none; }
      li { overflow-wrap: anywhere; padding: .65rem 0; border-top: 1px solid #edf0f5; }
      a { color: #4a56ca; }
      .database-results { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 180px), 1fr)); gap: .65rem; }
      .database-result { padding: .85rem; border: 1px solid #e2e7f0; border-radius: 12px; }
      .database-result strong { display: block; }
      .database-result span { display: block; margin-top: .25rem; color: #60708c; font-size: .85rem; }
      .passed { border-color: #a5dfc2; background: #f2fbf6; }
      .failed { border-color: #f1b3b3; background: #fff5f5; }
      .not-configured { border-color: #efd292; background: #fffaf0; }
      #status { min-height: 1.5rem; margin: 1rem 0 0; font-weight: 650; }
      @media (max-width: 560px) { main { width: min(100% - 1rem, 1100px); padding-top: 1rem; } header { align-items: start; flex-direction: column; } button { width: 100%; } }
    </style>
  </head>
  <body>
    <main>
      <header>
        <div>
          <p class="eyebrow">Deployment smoke test</p>
          <h1>HomeServer Toy App</h1>
          <p id="message">Connecting to the backend…</p>
        </div>
      </header>

      <div class="grid">
        <section class="card wide">
          <h2>Database integrations</h2>
          <p>Run idempotent write/read checks against PostgreSQL, MongoDB, Redis, pgvector, and Neo4j.</p>
          <button id="run-database-tests" type="button">Run all database tests</button>
          <ul id="database-results" class="database-results" aria-live="polite"></ul>
        </section>

        <section class="card">
          <h2>PostgreSQL users</h2>
          <form id="user-form">
            <input id="username" aria-label="Username" maxlength="100" placeholder="Enter a username" required>
            <button>Save username</button>
          </form>
          <ul id="users"></ul>
        </section>

        <section class="card">
          <h2>Sandbox storage</h2>
          <form id="upload-form">
            <input id="file" aria-label="File" type="file" required>
            <button>Upload file</button>
          </form>
          <ul id="files"></ul>
        </section>
      </div>

      <p id="status" role="status"></p>
    </main>
    <script>
      const request = async (url, options) => {
        const response = await fetch(url, options);
        const result = await response.json();
        if (!response.ok && !result.results) throw new Error(result.error || `Request returned ${response.status}`);
        return result;
      };

      const showStatus = (message) => document.querySelector('#status').textContent = message;

      const loadUsers = async () => {
        const { users } = await request('api/users');
        document.querySelector('#users').replaceChildren(...users.map(({ username }) => {
          const item = document.createElement('li');
          item.textContent = username;
          return item;
        }));
      };

      const loadFiles = async () => {
        const { files } = await request('api/files');
        document.querySelector('#files').replaceChildren(...files.map(({ name, size }) => {
          const item = document.createElement('li');
          const link = document.createElement('a');
          link.href = `uploads/${encodeURIComponent(name)}`;
          link.textContent = `${name} (${size} bytes)`;
          item.append(link);
          return item;
        }));
      };

      const renderDatabaseResults = ({ results }) => {
        document.querySelector('#database-results').replaceChildren(...results.map((result) => {
          const item = document.createElement('li');
          item.className = `database-result ${result.status}`;
          const name = document.createElement('strong');
          name.textContent = `${result.database}: ${result.status.replace('-', ' ')}`;
          const detail = document.createElement('span');
          detail.textContent = result.detail || result.error || `${result.variable} is not configured.`;
          const timing = document.createElement('span');
          timing.textContent = `${result.latencyMs} ms`;
          item.append(name, detail, timing);
          return item;
        }));
      };

      document.querySelector('#run-database-tests').addEventListener('click', async (event) => {
        const button = event.currentTarget;
        button.disabled = true;
        showStatus('Testing all database integrations…');
        try {
          const result = await request('api/database-tests', { method: 'POST' });
          renderDatabaseResults(result);
          showStatus(result.allPassed ? 'All database tests passed.' : 'One or more database tests need attention.');
        } catch (error) { showStatus(error.message); }
        finally { button.disabled = false; }
      });

      document.querySelector('#user-form').addEventListener('submit', async (event) => {
        event.preventDefault();
        try {
          await request('api/users', {
            method: 'POST',
            headers: { 'content-type': 'application/json' },
            body: JSON.stringify({ username: document.querySelector('#username').value }),
          });
          event.target.reset();
          await loadUsers();
          showStatus('Username saved.');
        } catch (error) { showStatus(error.message); }
      });

      document.querySelector('#upload-form').addEventListener('submit', async (event) => {
        event.preventDefault();
        const file = document.querySelector('#file').files[0];
        try {
          await request(`api/uploads?name=${encodeURIComponent(file.name)}`, {
            method: 'POST',
            headers: { 'content-type': file.type || 'application/octet-stream' },
            body: file,
          });
          event.target.reset();
          await loadFiles();
          showStatus('File uploaded.');
        } catch (error) { showStatus(error.message); }
      });

      Promise.all([
        request('api/message').then(({ message }) => {
          document.querySelector('#message').textContent = message;
        }),
        loadUsers(),
        loadFiles(),
      ]).catch((error) => showStatus(error.message));
    </script>
  </body>
</html>
